# Plaats dit bestand in: DataInside/.github  →  .github/workflows/trivy-scan.yml
#
# Dit is de HERBRUIKBARE workflow. Hij draait nooit vanzelf — hij wordt
# aangeroepen door het stub-bestand (security-scan.yml) in elke losse repo.
# Werkt voor Laravel/PHP (composer.lock) én Python (requirements.txt,
# poetry.lock, Pipfile.lock) zonder aanpassing, want Trivy leest de
# lock-files, niet de taal zelf.

name: Trivy Security Scan (reusable)

on:
  workflow_call:
    inputs:
      severity:
        description: "Comma-separated severities om te rapporteren"
        type: string
        default: "MEDIUM,HIGH,CRITICAL"
      scan-path:
        description: "Pad binnen de repo dat gescand moet worden"
        type: string
        default: "."

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
       
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: ${{ inputs.scan-path }}
          severity: ${{ inputs.severity }}
          skip-dirs: "vendor,node_modules,.git"
          exit-code: "0"        # nooit falen — puur rapporteren in de log
          format: "table"       # leesbare tabel, geen SARIF nodig
          ignore-unfixed: false # ook tonen als er nog geen fix is (informatief)
